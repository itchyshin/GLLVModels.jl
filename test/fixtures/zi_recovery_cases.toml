# Literal zi_nbinom2() regression datasets for test/test_zi_recovery.jl.
# R values: gllvmTMB 0.7.1 at commit 9539352f66f2db2cc26b1c393e67212a359b60c9, R 4.6.0,
# y ~ 0 + trait + latent(0 + trait | site, d = 1, unique = FALSE), family = zi_nbinom2(),
# gllvmTMBcontrol(se = FALSE). CSV columns: site, trait, y.

[nb2_reviewer_seed12]
