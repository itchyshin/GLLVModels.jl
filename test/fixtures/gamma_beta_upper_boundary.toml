# Literal data for the Gamma/Beta grouped upper-boundary fix
# (test/test_gamma_beta_upper_boundary.jl). Drawn on Julia 1.10.12,
# aarch64-apple-darwin (2026-09-29), p = 4, n = 60, K = 1, q = 1, with
# MersenneTwister seeds; literal values, not seeds, because the seeded draw
# differs across Julia versions. Values are in t-fastest (Julia column-major)
# order; X is p x n x q. data_sha256 / X_sha256 = sha256 of the bytes of
# vec(Float64.(A)).
#
# Generators (beta_t, Lambda, Z, X drawn in that order from MersenneTwister(seed)):
#   Gamma: beta = 0.3 .* randn .+ 1.0, Lambda = 0.5 .* randn, eta = beta + Lambda*Z
#          (+ 0.3 .* X for *_cov), Y = rand(Gamma(alpha, exp(eta) / alpha)).
#   Beta:  beta = 0.3 .* randn, Lambda = 0.5 .* randn, mu = logistic(eta),
#          Y = clamp(rand(Beta(mu * phi, (1 - mu) * phi)), 1e-6, 1 - 1e-6).
#   gamma_lower: Y = 10^(14 * (2 * rand - 1)) with MersenneTwister(5); the fit
#          runs the shape to the LOWER end (alpha = 0 after underflow).
#   nb_upper: Poisson(2) counts with MersenneTwister(7); NB2 r runs to the
#          Poisson limit (upper end, flat likelihood).
#   healthy_*: interior shape / precision, group = [1, 1, 2, 2].
#
# main_julia_1_10_* / main_julia_1_13_* record origin/main 0ce4a35aa (default
# settings: fit_{gamma,beta}_gllvm_grouped[_cov](Y; [X], K = 1, group),
# fit_nb_gllvm_grouped(round.(Int, Y); K = 1, group)) on Julia 1.10.12 and
# 1.13.0, aarch64-apple-darwin. On main every *_huge case estimated its
# shape / precision close to the truth 1e8 yet reported converged = false,
# because the shared dispersion boundary treated any value above 1e6 as a
# boundary.

