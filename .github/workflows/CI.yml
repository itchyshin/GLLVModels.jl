name: CI
on:
  # Markdown-only changes skip the suite: a docs push otherwise costs a full
  # 8-shard run (~1 h of runners) to re-prove code it did not touch. GitHub
  # skips the workflow only when EVERY changed file matches, so a mixed
  # commit still runs.
  #
  # Deliberately NOT `docs/**` — tests read data files from there:
  # docs/dev-log/core070/frozen-r070-contract.toml
  # (test_core070_interface_registry.jl, test_core070_covariance_registry.jl,
  # test_core070_covariance_formula_registry.jl) and
  # docs/dev-log/core070/binomial-paired-contract.toml
  # (test_binomial_case_contract.jl). Ignoring docs wholesale would skip CI on
  # a contract edit that can break the suite. No test reads a .md file.
  # Documenter.yml has no paths-ignore, so docs/src/*.md still rebuild the site.
  #
  # The two lists are written out rather than shared via a YAML anchor:
  # GitHub Actions does not support anchors/aliases, so `&x` / `*x` would not
  # resolve.
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      full_matrix:
        description: 'Run macOS + Windows too (use before a release)'
        type: boolean
        default: false
      coverage:
        description: 'Collect and upload coverage (use before a release)'
        type: boolean
        default: false
concurrency:
  # Non-PR runs get one group per commit. With cancel-in-progress false, GitHub
  # still keeps only one PENDING run per group and cancels the older one, so a
  # shared main group let a burst of merges cancel a queued run before it
  # started (b3d86fe6, 2026-09-27). PR runs keep one group per ref.
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name != 'pull_request' && format('-{0}', github.sha) || '' }}
  # Never cancel a run on main: a superseded main run reports no status at all,
  # and "green by absence" is indistinguishable from green. PR runs are the only
  # ones a later push makes genuinely redundant. (Carried over from PR #278.)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    # Shard suffix only on the routine ubuntu combos (matrix.shard is set there);
    # the full_matrix-only macOS/Windows combos below have no `shard` and run
    # the whole suite in one job, as before.
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}${{ matrix.shard && format(' shard {0}/4', matrix.shard) || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Routine runs are Linux-only (LTS + current stable): the suite is now
        # ~13k tests and takes hours per OS, so a 4-OS matrix on every push
        # costs real money (macOS 10x, Windows 2x the Linux rate) and — with
        # cancel-in-progress — rarely even finishes before the next push.
        # macOS/Windows coverage runs on demand via workflow_dispatch with
        # full_matrix=true, which is what a release needs.
        #
        # `shard` 4-ways splits each routine (version, os) combo via
        # GLLVM_TEST_SHARD (see test/runtests.jl) so 2 versions x 1 os x 4
        # shards = 8 Julia jobs, each covering ~1/4 of the ~13k tests instead
        # of one multi-hour job.
        version: ['1.10', '1']     # LTS + current stable
        os: [ubuntu-latest]
        shard: [1, 2, 3, 4]
        include: ${{ (github.event_name == 'workflow_dispatch' && inputs.full_matrix) && fromJSON('[{"version":"1","os":"macOS-latest"},{"version":"1","os":"windows-latest"}]') || fromJSON('[]') }}
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          # Empty (not "k/4") on the shard-less full_matrix combos above, which
          # runs the whole suite there unchanged; test/runtests.jl treats an
          # unset/empty GLLVM_TEST_SHARD as "no sharding".
          GLLVM_TEST_SHARD: ${{ matrix.shard && format('{0}/4', matrix.shard) || '' }}
        with:
          # Coverage is off on routine (push/PR) runs — instrumentation cost
          # across 8 sharded jobs adds up for no benefit most pushes need; turn
          # it on with workflow_dispatch's `coverage` input before a release.
          coverage: ${{ github.event_name == 'workflow_dispatch' && inputs.coverage }}
      - uses: julia-actions/julia-processcoverage@v1
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.coverage }}
      - uses: codecov/codecov-action@v6
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.coverage }}
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
        continue-on-error: true

  test-parity:
    name: Frozen R 0.7.0 family smoke (advisory; rebuilt oracle)
    runs-on: ubuntu-latest
    # ADVISORY, not blocking — see
    # docs/dev-log/core070/ci-oracle-reproducibility-finding.md: a rebuilt
    # oracle matches the frozen SOURCE and R version but not the retained
    # BUILD (installed_tree_sha256 differs), and two cells' R-side health
    # gates were calibrated against that build. The retained pinned-build
    # receipts remain the authority; this job still runs and still uploads
    # its receipts and failures. No engine gate or tolerance was changed.
    continue-on-error: true
    # Not run on pull requests: it has failed the same 9 assertions on main
    # since 2026-09-25 on every PR, so on a PR it carries no signal and only
    # adds a red mark and a queued job. It still runs on pushes to main and on
    # workflow_dispatch; the build-independent rewrite of its cells is owed.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          # Pinned to the retained oracle receipt's own R
          # (.unlazy/core070-aghq/oracle-receipts/build.json: "R version 4.5.3").
          # 'release' floated ahead of the pinned build and the CI-built oracle
          # then landed at slightly different optima than the retained one —
          # R's own gradient failed the cells' 1e-4 health gate (2.4e-3) and
          # its Student-t free-nu fit did not converge. The oracle must be
          # reproduced, not approximated.
          r-version: '4.5.3'
          use-public-rspm: true
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Check out the frozen R reference
        uses: actions/checkout@v6
        with:
          repository: itchyshin/gllvmTMB
          ref: b4d5fee64def88bc768dda1f1f77c29b295edd86
          path: .unlazy/r-source
      - name: System libraries for the spatial R stack (units/sf/fmesher)
        run: |
          # The dated CRAN snapshot serves sources for these, so the geo stack
          # must be present to compile them; the floating binary repo used to
          # hide this. Cheap and deterministic.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libudunits2-dev libgdal-dev libgeos-dev libproj-dev

      - name: Build an isolated, source-pinned R oracle
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Date-locked snapshot so TMB/Matrix/RcppEigen resolve to the same
          # versions the retained oracle build used (floating CRAN is what let
          # the CI oracle drift from the pinned one).
          Rscript -e 'options(repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/noble/2026-08-31"), HTTPUserAgent = sprintf("R/%s R (%s)", getRversion(), paste(getRversion(), R.version$platform, R.version$arch, R.version$os))); install.packages("remotes"); remotes::install_deps(".unlazy/r-source", dependencies=c("Depends", "Imports", "LinkingTo"), upgrade="never")'
          python3 tools/core070_build_oracle.py prepare --repo .unlazy/r-source --destination .unlazy/r-archive
          python3 tools/core070_build_oracle.py build --archive .unlazy/r-archive/gllvmTMB-core070.tar --source-receipt .unlazy/r-archive/source.json --destination .unlazy/r-build --r-binary "$(command -v R)" --timeout 1200
          python3 tools/core070_build_oracle.py verify --destination .unlazy/r-build
      - name: Instantiate parity environment
        run: |
          julia --project=test/parity -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate(); Pkg.build("RCall"); Pkg.precompile()'
      - name: Stage oracle receipts where the parity helper reads them
        run: |
          # test/parity/parity_helpers.jl pins the retained-receipt layout
          # (.unlazy/core070-aghq/...); the CI build writes to .unlazy/r-build
          # and .unlazy/r-archive. Copy, never move: the upload-artifact step
          # still retains the build-side originals.
          mkdir -p .unlazy/core070-aghq/oracle-receipts .unlazy/core070-aghq/oracle-source
          cp .unlazy/r-build/build.json .unlazy/core070-aghq/oracle-receipts/build.json
          cp .unlazy/r-archive/source.json .unlazy/core070-aghq/oracle-source/source.json

      - name: Run parity suite with LD_PRELOAD libunwind
        run: |
          export LD_PRELOAD="$(julia -e 'print(abspath(joinpath(Sys.BINDIR, "..", "lib", "julia", "libunwind.so.8")))')"
          # Single-threaded BLAS is the campaign's standing convention
          # (AGENTS.md compute rules; every Totoro/DRAC run pins it). Without
          # it the runner's multi-threaded BLAS takes a different optimizer
          # path and R's own fit lands at a different optimum — CI measured
          # r_gradient_max 2.4e-3 where the retained Totoro receipt for the
          # SAME fixture (cell-NATIVE-06-NB2.toml, 18/18 assertions) passes
          # the cells' 1e-4 gate.
          export OPENBLAS_NUM_THREADS=1
          export OMP_NUM_THREADS=1
          export JULIA_NUM_THREADS=1
          export GLLVM_PARITY_TESTS=1
          export CORE070_PARITY_REQUIRED=1
          export GLLVM_PARITY_RECEIPT_DIR="$PWD/.unlazy/ci-parity-receipts"
          export R_LIBS="$PWD/.unlazy/r-build/library"
          export GLLVM_PARITY_R_LIBS="$R_LIBS"
          export GLLVM_PARITY_R_SOURCE_PIN="$R_LIBS/gllvmTMB/CORE070_SOURCE_PIN.toml"
          export R_HOME="$(R RHOME)"
          export LD_LIBRARY_PATH="$(R RHOME)/lib:$LD_LIBRARY_PATH"
          julia --project=test/parity test/parity/runparity.jl

      - name: Retain oracle provenance and parity receipts, including failures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: frozen-core070-family-smoke
          include-hidden-files: true
          path: |
            .unlazy/r-archive/source.json
            .unlazy/r-build/build.json
            .unlazy/r-build/install.log
            .unlazy/r-build/library/gllvmTMB/CORE070_SOURCE_PIN.toml
            .unlazy/ci-parity-receipts/
